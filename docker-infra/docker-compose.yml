name: design-software

# =============================================================================
# BASE DE DATOS ÚNICA - todos los módulos apuntan aquí
#
# USO:
#   1. Levantar la base de datos:
#      docker compose up postgres -d
#
#   2. Aplicar changelogs de un módulo:
#      docker compose --profile tooling run --rm liquibase-<modulo> update
#
#   Módulos disponibles:
#     liquibase-academic | liquibase-actors   | liquibase-audit
#     liquibase-document | liquibase-iam      | liquibase-monitoring
#     liquibase-reference| liquibase-scheduling| liquibase-training
# =============================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: design-software-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  liquibase-academic:
    build: .
    image: ds-liquibase:latest
    container_name: ds-liquibase-academic
    profiles: [tooling]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ../design-software-academic-management-db:/workspace
    entrypoint:
      - liquibase
      - --search-path=/workspace
      - --changeLogFile=changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - --username=${POSTGRES_USER}
      - --password=${POSTGRES_PASSWORD}

  liquibase-actors:
    build: .
    image: ds-liquibase:latest
    container_name: ds-liquibase-actors
    profiles: [tooling]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ../design-software-actors-db:/workspace
    entrypoint:
      - liquibase
      - --search-path=/workspace
      - --changeLogFile=changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - --username=${POSTGRES_USER}
      - --password=${POSTGRES_PASSWORD}

  liquibase-audit:
    build: .
    image: ds-liquibase:latest
    container_name: ds-liquibase-audit
    profiles: [tooling]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ../design-software-audit-db:/workspace
    entrypoint:
      - liquibase
      - --search-path=/workspace
      - --changeLogFile=changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - --username=${POSTGRES_USER}
      - --password=${POSTGRES_PASSWORD}

  liquibase-document:
    build: .
    image: ds-liquibase:latest
    container_name: ds-liquibase-document
    profiles: [tooling]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ../design-software-document-db:/workspace
    entrypoint:
      - liquibase
      - --search-path=/workspace
      - --changeLogFile=changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - --username=${POSTGRES_USER}
      - --password=${POSTGRES_PASSWORD}

  liquibase-iam:
    build: .
    image: ds-liquibase:latest
    container_name: ds-liquibase-iam
    profiles: [tooling]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ../design-software-iam-db-main:/workspace
    entrypoint:
      - liquibase
      - --search-path=/workspace
      - --changeLogFile=changelog/changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - --username=${POSTGRES_USER}
      - --password=${POSTGRES_PASSWORD}

  liquibase-monitoring:
    build: .
    image: ds-liquibase:latest
    container_name: ds-liquibase-monitoring
    profiles: [tooling]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ../design-software-monitoring-db:/workspace
    entrypoint:
      - liquibase
      - --search-path=/workspace
      - --changeLogFile=changelog/changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - --username=${POSTGRES_USER}
      - --password=${POSTGRES_PASSWORD}

  liquibase-reference:
    build: .
    image: ds-liquibase:latest
    container_name: ds-liquibase-reference
    profiles: [tooling]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ../design-software-reference-data-db:/workspace
    entrypoint:
      - liquibase
      - --search-path=/workspace
      - --changeLogFile=changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - --username=${POSTGRES_USER}
      - --password=${POSTGRES_PASSWORD}

  liquibase-scheduling:
    build: .
    image: ds-liquibase:latest
    container_name: ds-liquibase-scheduling
    profiles: [tooling]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ../design-software-scheduling-db:/workspace
    entrypoint:
      - liquibase
      - --search-path=/workspace
      - --changeLogFile=changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - --username=${POSTGRES_USER}
      - --password=${POSTGRES_PASSWORD}

  liquibase-training:
    build: .
    image: ds-liquibase:latest
    container_name: ds-liquibase-training
    profiles: [tooling]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ../design-software-training-environment-db:/workspace
    entrypoint:
      - liquibase
      - --search-path=/workspace
      - --changeLogFile=changelog/db.changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - --username=${POSTGRES_USER}
      - --password=${POSTGRES_PASSWORD}

  # ---------------------------------------------------------------------------
  # Correo de prueba local (MailHog) - opcional, solo para validar envíos.
  # Bandeja de entrada: http://localhost:8025
  # ---------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: design-software-mailhog
    profiles: [tooling]
    ports:
      - "1025:1025"
      - "8025:8025"

  # ---------------------------------------------------------------------------
  # API IAM (Go) - backend de autenticación / RBAC
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../API-Go
      dockerfile: ../docker-infra/api-go.Dockerfile
    container_name: design-software-api
    env_file: ../API-Go/.env
    environment:
      APP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
